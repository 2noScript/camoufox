name: Fork Browser Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag (v<version>-stream.<N>); empty auto-increments
        required: false
        default: ""
      prerelease:
        description: Mark GitHub Release as prerelease (false lets camoufox fetch use it as stable)
        required: false
        type: boolean
        default: false
      targets:
        description: Comma-separated target-arch list or "all" (linux-x86_64,linux-arm64,windows-x86_64,macos-x86_64,macos-arm64)
        required: false
        default: all
  push:
    branches: [feat/sdk-headless-stream]
    paths:
      - "browser/**"
      - "ci/release.py"
      - "ci/run_*.py"
      - ".github/workflows/fork-release.yml"
      - ".github/actions/build-host/**"

permissions: {}

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ubo: ${{ steps.ubo.outputs.pin }}
      digest: ${{ steps.meta.outputs.digest }}
      browser_tag: ${{ steps.meta.outputs.browser_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: ubo
        run: python3 browser/scripts/fetch-ubo.py resolve

      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_PRE: ${{ inputs.prerelease || 'false' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, re, subprocess
          from ci._util import read_upstream_sh, set_output
          from ci.browser_inputs import source_digest

          up = read_upstream_sh()
          ver = up["version"]

          if os.environ["REF_TYPE"] == "tag":
              tag = os.environ["REF_NAME"]
          elif os.environ["INPUT_TAG"].strip():
              tag = os.environ["INPUT_TAG"].strip()
          else:
              tags = subprocess.check_output(["git", "tag", "-l", "v*"], text=True).split()
              pat = re.compile(rf"^v{re.escape(ver)}-stream\.(\d+)$")
              used = [int(m.group(1)) for t in tags if (m := pat.match(t))]
              tag = f"v{ver}-stream.{max(used, default=0) + 1}"

          if not re.match(r"^v[^-]+-[a-z]+\.\d+$", tag):
              raise SystemExit(f"Invalid browser tag {tag!r}; expected v<version>-<prefix>.<n>")

          set_output("digest", source_digest())
          set_output("browser_tag", tag)
          set_output("prerelease", "true" if os.environ["INPUT_PRE"].lower() == "true" else "false")
          EOF

  build-browser:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      BUILD_TARGET: ${{ matrix.target }},${{ matrix.arch }}
      CAMOUFOX_UBO: ${{ needs.prepare.outputs.ubo }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, macos]
        arch: [x86_64, arm64, i686]
        exclude:
          - target: windows
            arch: arm64
          - target: macos
            arch: i686
          - target: linux
            arch: i686
    if: >-
      github.event_name == 'push' ||
      (inputs.targets || 'all') == 'all' ||
      contains(format(',{0},', inputs.targets), format(',{0}-{1},', matrix.target, matrix.arch))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Name this release
        run: python3 -m ci.release set-build --tag "${{ needs.prepare.outputs.browser_tag }}"

      - uses: ./.github/actions/build-host
        with:
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fetch the font bundle
        working-directory: browser
        run: make fonts-extract

      - name: Verify the font bundle matches the manifest
        working-directory: browser
        run: |
          python3 -m pip install -e ../python
          python3 scripts/verify-fonts.py

      - name: Prepare the source tree
        run: python3 -m ci.run_prepare

      - name: Build
        env:
          CARGO_BUILD_JOBS: "1"
        run: python3 -m ci.run_build --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: browser/dist/*

  publish-browser:
    needs: [prepare, build-browser]
    if: ${{ !cancelled() && needs.build-browser.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download the builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: CamoufoxBuilds-*
          path: artifacts

      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.browser_tag }}
          UBO: ${{ needs.prepare.outputs.ubo }}
          IS_PRE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          python3 -m ci.release manifest --tag "$TAG" \
            --digest "${{ needs.prepare.outputs.digest }}" \
            --commit "${{ needs.prepare.outputs.sha }}" \
            --ubo "$UBO" > manifest.json
          cat manifest.json
          ubo_version="$(python3 -c 'import json, os; print(json.loads(os.environ["UBO"])["version"])')"
          pre_flag=""
          if [ "$IS_PRE" = "true" ]; then
            pre_flag="--prerelease"
          fi
          target_flag=""
          if [ "${{ github.ref_type }}" != "tag" ]; then
            target_flag="--target ${{ needs.prepare.outputs.sha }}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              $(find artifacts -type f) manifest.json
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              $target_flag \
              $pre_flag \
              --title "$TAG" \
              --notes "Patched Camoufox build (headless-stream) with uBlock Origin $ubo_version." \
              --generate-notes \
              $(find artifacts -type f) manifest.json
          fi
